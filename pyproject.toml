[project]
name = "data-onboarding-agent"
version = "0.1.0"
description = "Agent that maps messy customer data files onto a target schema and builds tested dbt tables"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=2.0.0",
    "faker>=40.54.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
