name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0  # setup-uv publishes no floating major tags
      - uses: actions/setup-node@v7
        with:
          node-version: 26.12.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: |
          uv sync --locked
          make web-install
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Build the web app
        run: make web-build
      - name: Generate eval cases
        run: make seed
      - name: Eval smoke test (FakeLLM)
        run: make eval-smoke

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
      - name: Build the api/tools image
        run: docker build -t data-onboarding-agent:ci .
      - name: Build the web image
        run: docker build -t data-onboarding-web:ci web

  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The CLI scans the full history. gitleaks-action fails on a repo's first push
      # because it diffs from the parent of the root commit.
      - name: Scan full git history for secrets
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --redact --verbose .
